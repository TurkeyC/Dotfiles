[global]
# 缓存目录放到 VenvG_Native
cache-dir = /home/casuki/VenvG_Native/pip-cache

# 默认使用虚拟环境（可选）
require-virtualenv = false

# 增加超时时间（网络慢时）
timeout = 120

# 使用国内镜像源（可选，加速下载）
index-url = https://pypi.tuna.tsinghua.edu.cn/simple
trusted-host = pypi.tuna.tsinghua.edu.cn

[install]
# 默认不要求虚拟环境
require-virtualenv = false
